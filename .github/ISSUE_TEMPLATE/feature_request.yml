name: 💡 Идея
description: Предложить новую функцию или улучшение
title: "[Идея] "
labels: ["idea"]
body:
  - type: dropdown
    id: product
    attributes:
      label: Для чего идея
      options:
        - WaveShape
        - BlueBerry
        - Сайт
        - Сервер SWAY
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Идея
      description: Что добавить или изменить и зачем это нужно
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Как это может выглядеть
      description: Команда, кнопка, пример из другого бота — всё, что поможет понять задумку
